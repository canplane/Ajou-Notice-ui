<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ajou Notice</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #container {
      width: 440px;
      height: 680px;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="https://unpkg.com/@ruffle-rs/ruffle@nightly"></script>
  <script>
    const swfPath = "prototype-20140927.swf";

    // Notice titles are dynamic text pulled live from the portal, so only a
    // fixed subset of Korean glyphs could ever be embedded in the SWF itself
    // — the rest falls back to a device font, which Ruffle can't read off
    // the OS the way desktop Flash Player could. fonts/nanum-gothic.ttf
    // supplies that fallback directly (Ruffle can load TTF/OTF here, no SWF
    // compilation needed).
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.style.width = "440px";
    player.style.height = "680px";
    document.getElementById("container").appendChild(player);
    player.load({
      url: swfPath,
      fontSources: [new URL("fonts/nanum-gothic.ttf", location.href).href],
      defaultFonts: {
        sans: ["NanumGothic"],
        serif: ["NanumGothic"],
        typewriter: ["NanumGothic"],
      },
    });
  </script>
</body>
</html>
